name: Build, Test, and Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Apple Silicon macOS build
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('Package.resolved', 'SpeachText1.0.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SpeachText1.0.xcodeproj \
            -scheme SpeachText1.0 \
            -clonedSourcePackagesDirPath .build/SourcePackages

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpeachText1.0.xcodeproj \
            -scheme SpeachText1.0 \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation \
            -skip-testing:SpeachTextTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Build release installers
        env:
          SPEACHTEXT_SOURCE_PACKAGES: ${{ github.workspace }}/.build/SourcePackages
        run: ./scripts/package_release.sh

      - name: Verify release installers
        run: ./scripts/verify_release.sh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeachText1.0-macOS-arm64
          path: |
            dist/SpeachText1.0-*.dmg
            dist/SpeachText1.0-*.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "SpeachText1.0 ${tag#v}" \
              --generate-notes
          fi
          gh release upload "$tag" \
            dist/SpeachText1.0-*.dmg \
            dist/SpeachText1.0-*.zip \
            dist/SHA256SUMS.txt \
            dist/release-manifest.json \
            --clobber
